name: Security

# Отдельно от CI/CD-пайплайна: сканеры не должны блокировать деплой, но должны
# быть видимы на каждый push/PR и раз в неделю по расписанию. Блокирует сборку
# только одно — секрет в текущем дереве (gitleaks ниже): его нельзя пускать в
# master. Остальное — advisory (exit-code 0 / continue-on-error).

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Понедельник, 06:00 UTC — свежие CVE в зависимостях без нового коммита.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Секреты ──────────────────────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # вся история — для информативного скана ниже

      - name: Секреты в текущем дереве (блокирует)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --redact --no-banner -v

      - name: Секреты в истории git (информативно)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --no-banner -v

  # ── Зависимости и конфиги: уязвимости, секреты, мисконфиги Docker ─────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'    # report-only: печатаем в лог, деплой не рушим
          format: table

  # ── Python-зависимости бэкенда ───────────────────────────────────────────
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc

  # ── npm-зависимости фронта ───────────────────────────────────────────────
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        continue-on-error: true
        working-directory: ./frontend
        run: npm audit --audit-level=high
